<div class="grid grid-cols-1 md:grid-cols-2 gap-6">
  {% if before_photo_url %}
  <div>
    <h4 class="font-semibold mb-2">Before</h4>
    <img src="{{ before_photo_url }}" alt="Before" class="w-full max-w-md rounded shadow cursor-zoom-in"
         onclick="openLightbox('{{ before_photo_url|escapejs }}')">
  </div>
  {% endif %}

  {% if after_photo_url %}
  <div>
    <h4 class="font-semibold mb-2">After</h4>
    <img src="{{ after_photo_url }}" alt="After" class="w-full max-w-md rounded shadow cursor-zoom-in"
         onclick="openLightbox('{{ after_photo_url|escapejs }}')">
  </div>
  {% endif %}
</div>

<!-- Modal -->
<div id="lightbox" class="fixed inset-0 z-50 hidden bg-black/80">
  <button class="absolute top-4 right-6 text-white text-3xl" onclick="closeLightbox()">&times;</button>
  <img id="lightbox-img" src="" class="max-h-[90vh] max-w-[95vw] mx-auto my-[5vh] rounded shadow" alt="preview">
</div>

<script>
  function openLightbox(url){
    const img = document.getElementById('lightbox-img');
    img.src = url;
    document.getElementById('lightbox').classList.remove('hidden');
  }
  function closeLightbox(){
    document.getElementById('lightbox').classList.add('hidden');
    document.getElementById('lightbox-img').src = '';
  }
  // ปิดเมื่อคลิกพื้นหลัง
  document.getElementById('lightbox').addEventListener('click', (e)=>{
    if(e.target.id === 'lightbox') closeLightbox();
  });
  // ปิดด้วย ESC
  document.addEventListener('keydown', (e)=>{
    if(e.key === 'Escape') closeLightbox();
  });
</script>
